<!-- HTML Content -->
 <head>
    <style>
        /* From Uiverse.io by sahilxkhadka */ 
.card {
  width: 342px;
  height: 184px;
  position: relative;
  padding: 20px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.background {
  fill: linear-gradient(90deg, #5936B4 0%, #362A84 100%);
  position: absolute;
  inset: 0;
  z-index: -1;
}

.cloud {
  position: absolute;
  right: 0;
  top: -12px;
}

.cloud svg {
  height: 120px;
}

.card .main-text {
  font-size: 48px;
  z-index: 2;
}

.card .info {
  display: flex;
  justify-content: space-between;
}

.card .info .text-gray {
  color: rgba(235, 235, 245, 0.60);
}

.card .info .info-right {
  align-self: flex-end;
}

    </style>
 </head>
<body>
    <!-- HTML Content -->
<div class="card">
  <svg fill="none" viewBox="0 0 342 175" height="175" width="342" xmlns="http://www.w3.org/2000/svg" class="background">
    <path fill="url(#paint0_linear_103_640)" d="M0 66.4396C0 31.6455 0 14.2484 11.326 5.24044C22.6519 -3.76754 39.6026 0.147978 73.5041 7.97901L307.903 62.1238C324.259 65.9018 332.436 67.7909 337.218 73.8031C342 79.8154 342 88.2086 342 104.995V131C342 151.742 342 162.113 335.556 168.556C329.113 175 318.742 175 298 175H44C23.2582 175 12.8873 175 6.44365 168.556C0 162.113 0 151.742 0 131V66.4396Z"></path>
    <defs>
      <linearGradient gradientUnits="userSpaceOnUse" y2="128" x2="354.142" y1="128" x1="0" id="paint0_linear_103_640">
        <stop stop-color="#5936B4"></stop>
        <stop stop-color="#362A84" offset="1"></stop>
      </linearGradient>
    </defs>
  </svg>
  <div class="cloud">
    <!-- Cloud SVG remains the same -->
  </div>
  <p class="main-text" id="temperature">24°</p> <!-- Will be dynamically updated -->
  <div class="info">
    <div class="info-left">
      <p class="text-gray" id="high-low">H: 32° L: 16°</p> <!-- Will be dynamically updated -->
      <p id="location">Kathmandu, Nepal</p> <!-- Will be dynamically updated -->
    </div>
    <p class="info-right" id="weather-condition">Mid Rain</p> <!-- Will be dynamically updated -->
  </div>
</div>

<script>
  // Function to Fetch Weather Data from weather.php
  async function fetchWeather() {
    try {
      const response = await fetch('weather.php'); // Request the PHP file for weather data
      const data = await response.json();

      if (data.error) {
        console.error(data.error);
      } else {
        // Update the DOM with the data from PHP
        document.getElementById('temperature').textContent = `${data.temperature}°`;
        document.getElementById('high-low').textContent = `H:${data.high}° L: ${data.low}°`;
        document.getElementById('location').textContent = data.location;
        document.getElementById('weather-condition').textContent = data.condition;
      }
    } catch (error) {
      console.error('Error fetching weather data:', error);
    }
  }

  // Fetch weather data when the page loads
  window.onload = fetchWeather;
</script>

</body>
